schema_version: 1
kind: handumi_robot_table_calibration
robot: piper
scope: simulation
source: configured_layout
verified: false
calibration:
  frame_convention: pose7=[x,y,z,qx,qy,qz,qw], meters, xyzw quaternion
  # Table convention: +X right, +Y away from the operator, +Z up.
  # Piper robot world: +X forward, +Y left, +Z up. The table origin stays
  # laterally centered between the two arm bases.
  #
  # Depth: the ChArUco board center (the table-frame origin, see
  # board_from_table_pose) sits 0.325 m in front of the line joining the two
  # arm bases, measured on the physical BiPiper layout (2026-10-11). This
  # replaces the 0.45 m depth that a solver sweep had fitted to the tblock
  # recordings for the older 0.60 m base separation.
  #
  # The origin stays laterally centered between the bases on purpose: shifting
  # a shared calibration to rescue one recording distorts every other episode.
  # Episodes the placement cannot support are dropped by `handumi dataset
  # screen` instead.
  #
  # Simulation scope only: physical installations resolve
  # configs/calibration/table/local/piper.yaml (scope: physical) first, so
  # this file never overrides a measured lab placement.
  #
  # Height: the arm bases bolt onto a 3 cm T-slot rail laid across the table,
  # so the tabletop sits 0.03 m below the robot base plane (z=0; the Piper's
  # own 4 mm mounting plate is part of the base_link mesh). The provisional
  # extra 0.005 m adopted on 2026-09-05 was dropped on 2026-10-11: replaying
  # tblock-all puts the calibrated TCP at z>=0 in the table frame, so the
  # measured rail height is used as is. This transform is the source of truth
  # for the simulated table placement; robot embodiment configs do not
  # duplicate its height.
  robot_from_table:
    position: [0.325, 0.0, -0.03]
    quaternion: [0.0, 0.0, -0.70710678, 0.70710678]
