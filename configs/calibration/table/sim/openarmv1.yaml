schema_version: 1
kind: handumi_robot_table_calibration
robot: openarmv1
scope: simulation
source: simulation_initial_pose_alignment
verified: false
calibration:
  frame_convention: pose7=[x,y,z,qx,qy,qz,qw], meters, xyzw quaternion
  # HandUMI table: +X right, +Y away from the operator, +Z up.
  # OpenArm world: +X forward, +Y left, +Z up. This simulation transform was
  # fitted against the tblock dataset by sweeping rigid table shifts and
  # replaying the episode through the actual IK solver: +0.10 m forward and
  # -0.05 m down take episode 0 from failing --strict-ik at 3.48 cm on its
  # worst frame to mean 0.07 cm / max 0.38 cm. Euclidean
  # distance-to-home is NOT a valid placement
  # metric here -- raising the table toward the shoulders shrinks it while
  # sending real IK errors past 17 cm; trust solver rollouts only.
  # This moves the table frame, not the robot: the OpenArm pedestal remains
  # fixed to world Z=0 and its shoulder mounts remain at Z=0.698 m.
  # For hardware, create a separate scope: physical lab-local calibration;
  # never mark this canonical simulation file physically verified.
  robot_from_table:
    position: [0.27214, -0.01286, 0.23755]
    quaternion: [0.0, 0.0, -0.70710678, 0.70710678]
