schema_version: 1
kind: handumi_robot_table_calibration
robot: openarmv1
scope: simulation
source: simulation_initial_pose_alignment
verified: false
calibration:
  frame_convention: pose7=[x,y,z,qx,qy,qz,qw], meters, xyzw quaternion
  # HandUMI table: +X right, +Y away from the operator, +Z up.
  # OpenArm world: +X forward, +Y left, +Z up. This simulation transform was
  # fitted against yellow-towel-562 (19 episodes, every 30th) by sweeping rigid
  # table shifts through the screening solver: +0.04 m forward and +0.18 m up
  # from the previous tblock fit retarget all 19 (median p99 position error
  # 0.32 cm, no self-collision), where the tblock fit rejected 18 of them.
  # Towel demos reach farther and lift higher than tblock; adapt this file to
  # your own setup. Euclidean distance-to-home is NOT a valid placement
  # metric: trust solver rollouts only.
  # This moves the table frame, not the robot: the OpenArm pedestal remains
  # fixed to world Z=0 and its shoulder mounts remain at Z=0.698 m.
  # For hardware, create a separate scope: physical lab-local calibration;
  # never mark this canonical simulation file physically verified.
  robot_from_table:
    position: [0.31214, -0.01286, 0.41755]
    quaternion: [0.0, 0.0, -0.70710678, 0.70710678]
